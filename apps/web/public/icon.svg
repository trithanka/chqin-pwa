<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="ChqIn">
  <title>ChqIn</title>
  <!--
    The tab icon. A wordmark turns to mush at 16px, so this is the C and the
    green bar only — two shapes that survive being a few pixels across.

    No background: it sits on whatever the browser paints. The C follows the
    viewer's theme, because a white C disappears on a light tab strip and a
    dark one disappears on a dark strip.
  -->
  <style>
    .c { stroke: #0F172A }
    @media (prefers-color-scheme: dark) { .c { stroke: #FFFFFF } }
  </style>
  <path class="c" d="M32.6 16.9 A15 15 0 1 0 32.6 47.1" stroke-width="10" stroke-linecap="butt" />
  <rect x="49" y="12" width="10" height="40" fill="#22DD66" />
</svg>
