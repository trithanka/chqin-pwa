<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- viewport-fit=cover puts the app under the notch and home indicator,
         which the pt-safe / pb-safe utilities then pad back out. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />

    <!-- Added to the home screen, this launches standalone — no URL bar.
         The manifest link is injected at build time by vite-plugin-pwa. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChqIn" />
    <meta name="theme-color" content="#f8fafc" />
    <title>ChqIn — Check in by QR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
