<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 120" fill="none" role="img" aria-label="ChqIn">
  <title>ChqIn</title>
  <!--
    Transparent by design. The C takes `currentColor`, so the mark sits on any
    ground — set the colour on the parent and it follows. The green is fixed:
    it's the half that stays the same everywhere.
  -->
  <path
    d="M91.6 33.9 A40 40 0 1 0 91.6 86.1"
    stroke="currentColor"
    stroke-width="24"
    stroke-linecap="butt"
  />
  <rect x="146" y="8" width="24" height="104" fill="#22DD66" />
  <path
    d="M190 112 V70 a23 23 0 0 1 46 0 V112"
    stroke="#22DD66"
    stroke-width="24"
    stroke-linecap="butt"
  />
</svg>
