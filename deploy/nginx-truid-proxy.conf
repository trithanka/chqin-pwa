# TrueID egress proxy, on the Oracle VM.
#
# Why this exists: TrueID whitelists callers by IP, and Render sends outbound
# traffic from a CIDR range shared with every other service in the region —
# any address in it, unpredictably. This box has one reserved IP that is ours
# alone, so TrueID whitelists that and the API calls TrueID through here.
#
#   Render (shared CIDR) → this VM (140.245.205.76) → service-api.truid.one
#
# Install:
#   sudo cp nginx-truid-proxy.conf /etc/nginx/sites-available/truid-proxy
#   sudo ln -sf /etc/nginx/sites-available/truid-proxy /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo certbot --nginx -d proxy.chqin.in

server {
    listen 80;
    listen [::]:80;
    server_name proxy.chqin.in;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.chqin.in;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/proxy.chqin.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/proxy.chqin.in/privkey.pem;

    # Without this, anyone who finds the hostname can spend our TrueID wallet
    # through it — the whitelist protects TrueID from strangers, not us. The
    # API sends this header; see TRUID_PROXY_KEY in lib/truid.js.
    set $ok 0;
    if ($http_x_proxy_key = "REPLACE_WITH_A_LONG_RANDOM_STRING") { set $ok 1; }
    if ($ok = 0) { return 403; }

    # Guests' Aadhaar numbers pass through here in request bodies. nginx never
    # logs bodies, and the paths carry no identifiers — but keep the log small
    # and let Ubuntu's logrotate age it out.
    access_log /var/log/nginx/truid-proxy.access.log;
    error_log  /var/log/nginx/truid-proxy.error.log;

    location /api/v1/ {
        proxy_pass https://service-api.truid.one/api/v1/;

        # TrueID terminates TLS on a shared frontend: without SNI and a Host
        # header naming them, the upstream handshake fails or lands on the
        # wrong vhost.
        proxy_ssl_server_name on;
        proxy_set_header Host service-api.truid.one;

        # The signed headers truid.js sets have to survive the hop untouched.
        proxy_pass_request_headers on;
        proxy_set_header X-Proxy-Key "";

        # truid.js gives up at 12s; fail here first so the guest gets our
        # error rather than a dangling socket.
        proxy_connect_timeout 5s;
        proxy_read_timeout 11s;
    }

    location / { return 404; }
}
