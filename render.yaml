# Render blueprint. `render.yaml` at the repo root defines the service, so it
# can be recreated without clicking through settings.
#
# The API is a long-running process here rather than a function, which is why
# it needs no adapter: `npm start` runs the same src/index.js used locally.
services:
  - type: web
    # Matches the service that already exists. A different name here does not
    # rename that service — it creates a second one alongside it, and the
    # domain stays pointed at the first.
    name: chqin-pwa
    runtime: node
    region: singapore
    plan: starter
    # Not `free`: free instances sleep after 15 minutes, and the first request
    # back pays a 30-60 second cold start. A guest standing at a desk with a
    # scanned QR is the worst possible audience for that.
    rootDir: apps/api
    # Install from the repo root: running npm install inside a workspace pulls
    # only that workspace's dependencies, and the build fails on a missing
    # import from a sibling package.
    buildCommand: cd ../.. && npm install
    # Migrations run here, not in the build: a build can happen without a
    # deploy following it, and preDeploy runs after the image is ready but
    # before the new version takes traffic. A failed migration fails the
    # deploy, which is the outcome you want — the alternative is a process
    # booting against a schema it doesn't match.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Set the rest in the dashboard — they are secrets, or they change per
      # environment. See README → Deploying.
      - key: DATABASE_URL
        sync: false
      # Session mode, for the migration runner above.
      - key: DIRECT_URL
        sync: false
      # What the live service is already serving. It is tempting to move this
      # to the chqin.in apex — credentials would then work across app. and
      # business. rather than only on app. — but every passkey already
      # enrolled is bound to this exact string and would stop working. Only
      # worth changing after confirming the credentials table is empty.
      #
      # Guests enrol on app.chqin.in and staff sign in with a password, so
      # nothing needs the apex today.
      - key: RP_ID
        value: app.chqin.in
      - key: RP_NAME
        value: ChqIn
      - key: ORIGINS
        value: https://business.chqin.in,https://app.chqin.in
      # api.chqin.in and business.chqin.in share a registrable domain, so the
      # staff cookie is same-site and Lax is sent normally. Only correct while
      # the API is served from that custom domain — on onrender.com the cookie
      # is third party and this has to become None.
      - key: COOKIE_SAMESITE
        value: Lax
      # NOT generateValue: this keys every *_hmac lookup column in the
      # database. A regenerated value means no staff member can log in and no
      # returning guest is recognised, with no way to repair the rows — the
      # plaintext was never stored. Set once, by hand, and keep a copy
      # somewhere that survives losing this service.
      - key: HASH_PEPPER
        sync: false
      # Decrypts stored email addresses, so password reset has somewhere to
      # send to. 32 bytes, base64. Same warning as HASH_PEPPER.
      - key: ENCRYPTION_KEY
        sync: false
      # Resend, for password reset and address verification.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: ChqIn <no-reply@chqin.in>
      # Where the links in those emails point.
      - key: DASHBOARD_URL
        value: https://business.chqin.in
      - key: PG_CA_CERT
        sync: false
      # Optional: place search falls back to Nominatim when it is absent.
      - key: GOOGLE_PLACES_KEY
        sync: false
      # TrueID (truid.one) — the KUA behind the Aadhaar check. Without these the
      # API refuses to boot in production: absent credentials mean identity
      # checks would be simulated, which must never be silent.
      #
      # TrueID whitelists callers by IP per environment, so this service's
      # outbound addresses (Render → Settings → Outbound IPs) have to be
      # registered with them before a live key works.
      - key: TRUID_KEY_ID
        sync: false
      - key: TRUID_KEY_SECRET
        sync: false
